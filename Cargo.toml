[package]
name = "rle-bitmap-compare"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Micro-benchmark comparing ParquetAccessPlan representations (RLE vs bitmap) against a no-index baseline on a synthetic FTS workload."
repository = "https://github.com/haohuaijin/rle-bitmap-compare"
keywords = ["parquet", "datafusion", "arrow", "fts", "benchmark"]
categories = ["database"]
readme = "README.md"

[dependencies]
datafusion = { git = "https://github.com/haohuaijin/arrow-datafusion", branch = "use-mask-in-datafusion" }
futures = "0.3"
rayon = "1.10"
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
opt-level = 3
debug = false

# `RowSelection::from_boolean_buffer` landed upstream in apache/arrow-rs#10141.
# Pin the merge commit until a crates.io release containing it is available.
[patch.crates-io]
arrow = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
arrow-arith = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
arrow-array = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
arrow-buffer = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
arrow-cast = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
arrow-csv = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
arrow-data = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
arrow-ipc = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
arrow-json = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
arrow-ord = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
arrow-row = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
arrow-schema = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
arrow-select = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
arrow-string = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
parquet = { git = "https://github.com/apache/arrow-rs", rev = "f0ec758f4fb548de7fa32312377d8f57f8e5002a" }
